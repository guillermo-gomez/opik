services:
  exporter:
    build: .
    ports: ["127.0.0.1:8008:8008"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    depends_on: [exporter]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in your local .env}"
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/epoc.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/epoc.yml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
